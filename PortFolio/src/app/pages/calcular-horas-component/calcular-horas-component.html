<div class="calc-card">
  <div class="calc-header">
    <h2>Calculadora de hora de salida</h2>
    <p class="muted">Introduce tu horario y pausas; la calculadora te dirá a qué hora puedes irte.</p>
  </div>

  <form (ngSubmit)="calculateExitTime()" class="form-grid">
    <label class="field">
      <span class="label">Hora de entrada</span>
      <input class="input" type="time" [(ngModel)]="entryTime" name="entryTime" required />
    </label>

    <label class="field">
      <span class="label">Horas por computar</span>
      <input class="input" type="number" step="0.25" min="0" [(ngModel)]="hoursToCompute" name="hoursToCompute" placeholder="e.g. 8.5" required />
    </label>

    <fieldset class="optional">
      <legend>Desayuno (opcional)</legend>
      <div class="row">
        <label class="field">
          <span class="label">Salida</span>
          <input class="input" type="time" [(ngModel)]="salidaDesayuno" name="salidaDesayuno" />
        </label>
        <label class="field">
          <span class="label">Vuelta</span>
          <input class="input" type="time" [(ngModel)]="vueltaDesayuno" name="vueltaDesayuno" />
        </label>
      </div>
    </fieldset>

    <fieldset class="optional">
      <legend>Comida (opcional)</legend>
      <div class="row">
        <label class="field">
          <span class="label">Entrada</span>
          <input class="input" type="time" [(ngModel)]="entradaComida" name="entradaComida" />
        </label>
        <label class="field">
          <span class="label">Salida</span>
          <input class="input" type="time" [(ngModel)]="salidaComida" name="salidaComida" />
        </label>
        <label class="field">
          <span class="label">Minutos (opcional)</span>
          <input class="input" type="number" min="0" [(ngModel)]="minutosComida" name="minutosComida" placeholder="45" />
        </label>
      </div>
    </fieldset>

    <div class="buttons">
      <button type="button" class="general-button primary" (click)="calculateExitTime()">Calcular</button>
      <button type="button" class="general-button" (click)="clear()">Limpiar</button>
    </div>
  </form>

  <div class="output">
    <div *ngIf="result" class="result">Hora estimada de salida: <strong>{{ result }}</strong></div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>
</div>
